<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a fitted bathroom with vanity unit, tall storage and round mirror" preserveAspectRatio="xMidYMid slice" >
  <defs>
    <linearGradient id="bwall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe9df"/><stop offset="1" stop-color="#e4dccf"/></linearGradient>
    <linearGradient id="bfloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9bfae"/><stop offset="1" stop-color="#b7ac99"/></linearGradient>
    <linearGradient id="bsheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient>
    <linearGradient id="bmirror" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f4f0"/><stop offset=".5" stop-color="#dcdcd8"/><stop offset="1" stop-color="#c9cbc8"/></linearGradient>
    <linearGradient id="bbrass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6c991"/><stop offset=".5" stop-color="#b58d4f"/><stop offset="1" stop-color="#8a6834"/></linearGradient>
    <linearGradient id="btop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfaf7"/><stop offset="1" stop-color="#e7e3dc"/></linearGradient>
    <radialGradient id="bglow" cx=".5" cy=".3" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <pattern id="btiles" width="60" height="120" patternUnits="userSpaceOnUse"><rect width="60" height="120" fill="#e3dccf"/><path d="M0 0H60M0 0V120" stroke="#d2c9b9" stroke-width="2"/></pattern>
    <filter id="bsoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bwall)"/>
  <rect x="0" y="430" width="1200" height="380" fill="url(#btiles)"/>
  <rect x="0" y="426" width="1200" height="6" fill="#d6cdbd"/>
  <rect y="810" width="1200" height="90" fill="url(#bfloor)"/>
  <ellipse cx="640" cy="230" rx="420" ry="260" fill="url(#bglow)"/>
  <!-- tall unit -->
  <ellipse cx="215" cy="812" rx="120" ry="10" fill="#000" opacity=".18" filter="url(#bsoft)"/>
  <rect class="door" x="130" y="170" width="170" height="300" rx="3" fill="#39546e"/>
  <rect class="door" x="130" y="476" width="170" height="330" rx="3" fill="#39546e"/>
  <rect x="130" y="170" width="170" height="300" rx="3" fill="url(#bsheen)"/>
  <rect x="130" y="476" width="170" height="330" rx="3" fill="url(#bsheen)"/>
  <rect x="148" y="190" width="134" height="260" fill="none" stroke="#000" stroke-opacity=".14" stroke-width="3"/>
  <rect x="148" y="496" width="134" height="290" fill="none" stroke="#000" stroke-opacity=".14" stroke-width="3"/>
  <rect x="276" y="400" width="7" height="56" rx="3" fill="url(#bbrass)"/>
  <rect x="276" y="490" width="7" height="56" rx="3" fill="url(#bbrass)"/>
  <rect x="124" y="806" width="182" height="6" fill="#000" opacity=".2"/>
  <!-- mirror -->
  <circle cx="640" cy="270" r="138" fill="url(#bbrass)"/>
  <circle cx="640" cy="270" r="128" fill="url(#bmirror)"/>
  <path d="M560 190 L700 160" stroke="#fff" stroke-opacity=".7" stroke-width="10" stroke-linecap="round"/>
  <path d="M575 225 L640 210" stroke="#fff" stroke-opacity=".5" stroke-width="6" stroke-linecap="round"/>
  <!-- wall lights -->
  <rect x="452" y="240" width="10" height="70" rx="5" fill="url(#bbrass)"/><ellipse cx="457" cy="232" rx="16" ry="10" fill="#fff6e2"/>
  <rect x="818" y="240" width="10" height="70" rx="5" fill="url(#bbrass)"/><ellipse cx="823" cy="232" rx="16" ry="10" fill="#fff6e2"/>
  <!-- vanity -->
  <ellipse cx="640" cy="790" rx="230" ry="16" fill="#000" opacity=".16" filter="url(#bsoft)"/>
  <rect x="408" y="500" width="464" height="24" rx="4" fill="url(#btop)"/>
  <rect x="408" y="520" width="464" height="4" fill="#000" opacity=".08"/>
  <rect class="door" x="420" y="524" width="440" height="92" rx="2" fill="#39546e"/>
  <rect class="door" x="420" y="620" width="440" height="96" rx="2" fill="#39546e"/>
  <rect x="420" y="524" width="440" height="92" rx="2" fill="url(#bsheen)"/>
  <rect x="420" y="620" width="440" height="96" rx="2" fill="url(#bsheen)"/>
  <rect x="610" y="566" width="60" height="7" rx="3.5" fill="url(#bbrass)"/>
  <rect x="610" y="664" width="60" height="7" rx="3.5" fill="url(#bbrass)"/>
  <rect x="420" y="716" width="440" height="5" fill="#000" opacity=".22"/>
  <!-- basin + tap -->
  <path d="M560 500 Q560 462 640 462 Q720 462 720 500 Z" fill="#fdfcf9" stroke="#e1ddd5" stroke-width="2"/>
  <path d="M640 462 V418 Q640 404 654 404 H672" fill="none" stroke="url(#bbrass)" stroke-width="9" stroke-linecap="round"/>
  <!-- towel + plant -->
  <rect x="940" y="300" width="150" height="8" rx="4" fill="url(#bbrass)"/>
  <path d="M960 308 h110 v170 q-55 14 -110 0z" fill="#f4efe6"/>
  <path d="M960 308 h110 v24 h-110z" fill="#e8e0d2"/>
  <path d="M960 452 q55 14 110 0" stroke="#d9cfbf" stroke-width="3" fill="none"/>
  <ellipse cx="1010" cy="808" rx="70" ry="9" fill="#000" opacity=".15" filter="url(#bsoft)"/>
  <path d="M968 700 h84 l-10 106 h-64z" fill="#efe8dc" stroke="#d5cbbb" stroke-width="2"/>
  <g fill="none" stroke-linecap="round" stroke-width="10">
    <path d="M1010 700 C1000 640 960 610 930 600" stroke="#6f8f72"/>
    <path d="M1010 700 C1015 630 1050 590 1085 575" stroke="#5b7c60"/>
    <path d="M1010 700 C1010 640 1005 590 1012 540" stroke="#7d9c7f"/>
    <path d="M1010 700 C995 660 975 650 948 655" stroke="#86a487"/>
  </g>
</svg>